<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App voz — Piano roll de canto</title>
<style>
  body { background:#12141c; color:#e8ecf4; font-family: system-ui, sans-serif; margin:0; padding:24px; }
  .controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  #status { font-size:14px; opacity:0.8; margin-bottom:12px; line-height:1.6; }
  #pianoRoll { width:100%; max-width:900px; height:240px; background:#1a1d29; border-radius:8px; display:block; }
  button { background:#4a90d9; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .mic-controls { display:flex; align-items:center; gap:12px; margin: 16px 0; flex-wrap:wrap; }
  #levelMeterTrack { width:220px; height:16px; background:#1a1d29; border-radius:4px; overflow:hidden; }
  #levelMeterBar { height:100%; width:0%; background:#3ecf6e; transition: width 0.05s linear, background-color 0.1s linear; }
  input[type="range"] { width:160px; }
</style>
</head>
<body>
  <h1>App voz — Etapa 1</h1>
  <div class="controls">
    <label>MIDI: <input type="file" id="midiInput" accept=".mid,.midi"></label>
    <label>WAV: <input type="file" id="wavInput" accept=".wav"></label>
    <button id="playBtn">Reproducir</button>
  </div>
  <div id="status">
    <div id="midiStatus">Sin MIDI cargado.</div>
    <div id="wavStatus">Sin WAV cargado.</div>
  </div>
  <div class="mic-controls">
    <button id="micBtn">Activar micrófono</button>
    <label>Ganancia: <input type="range" id="micGain" min="0" max="2" step="0.01" value="1" disabled></label>
    <div id="levelMeterTrack"><div id="levelMeterBar"></div></div>
  </div>
  <div id="micStatus">Micrófono no activado.</div>
  <canvas id="pianoRoll" width="900" height="240"></canvas>

  <script src="./midi-parser.js"></script>
  <script src="./piano-roll-geometry.js"></script>
  <script src="./audio-level.js"></script>
  <script>
    const state = {
      audioContext: new (window.AudioContext || window.webkitAudioContext)(),
      audioBuffer: null,
      notes: [],
      durationSec: 0,
      sourceNode: null,
      playStartTime: 0,
      voces: []
    };

    const PIXELS_PER_SECOND = 150;
    const PLAYHEAD_X = 120;
    const ROW_HEIGHT = 18;
    const NOTE_COLOR = '#4a90d9'; // blue — Etapa 1 has no pitch detection yet, every note is blue

    function createVoz(stream, audioContext) {
      const source = audioContext.createMediaStreamSource(stream);
      const gainNode = audioContext.createGain();
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(gainNode);
      gainNode.connect(analyser);
      const buffer = new Uint8Array(analyser.fftSize);
      return {
        stream,
        source,
        gainNode,
        analyser,
        setGain(value) {
          gainNode.gain.value = value;
        },
        getLevel() {
          analyser.getByteTimeDomainData(buffer);
          return computeLevel(buffer);
        }
      };
    }

    function currentPlaybackTime() {
      if (!state.sourceNode) return 0;
      return state.audioContext.currentTime - state.playStartTime;
    }

    function renderPianoRoll() {
      const canvas = document.getElementById('pianoRoll');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const { minPitch, maxPitch } = pitchRange(state.notes);
      const view = {
        currentTime: currentPlaybackTime(),
        pixelsPerSecond: PIXELS_PER_SECOND,
        playheadX: PLAYHEAD_X,
        minPitch, maxPitch,
        canvasHeight: canvas.height,
        rowHeight: ROW_HEIGHT
      };

      ctx.fillStyle = NOTE_COLOR;
      for (const note of state.notes) {
        const rect = computeNoteRect(note, view);
        ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      }

      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(PLAYHEAD_X, 0);
      ctx.lineTo(PLAYHEAD_X, canvas.height);
      ctx.stroke();
    }

    renderPianoRoll();

    document.getElementById('midiInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        const { notes, durationSec } = parseMidi(buffer);
        state.notes = notes;
        state.durationSec = durationSec;
        document.getElementById('midiStatus').textContent =
          `MIDI cargado: ${notes.length} notas, duración ${durationSec.toFixed(2)}s`;
        renderPianoRoll();
      } catch (err) {
        state.notes = [];
        state.durationSec = 0;
        document.getElementById('midiStatus').textContent =
          `Error al cargar el MIDI: ${err.message || 'Archivo MIDI inválido'}`;
        renderPianoRoll();
      }
    });

    document.getElementById('wavInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const arrayBuffer = await file.arrayBuffer();
        state.audioBuffer = await state.audioContext.decodeAudioData(arrayBuffer);
        document.getElementById('wavStatus').textContent =
          `WAV cargado: ${state.audioBuffer.duration.toFixed(2)}s`;
      } catch (err) {
        state.audioBuffer = null;
        document.getElementById('wavStatus').textContent =
          `Error al cargar el WAV: ${err.message || 'Archivo WAV inválido'}`;
      }
    });

    async function play() {
      if (!state.audioBuffer) return;
      if (state.audioContext.state === 'suspended') {
        await state.audioContext.resume();
      }
      if (state.sourceNode) {
        state.sourceNode.onended = null;
        state.sourceNode.stop();
      }
      const node = state.audioContext.createBufferSource();
      node.buffer = state.audioBuffer;
      node.connect(state.audioContext.destination);
      state.sourceNode = node;
      state.playStartTime = state.audioContext.currentTime;
      node.start();
      node.onended = () => {
        if (state.sourceNode === node) state.sourceNode = null;
      };
      requestAnimationFrame(renderLoop);
    }

    function renderLoop() {
      renderPianoRoll();
      if (state.sourceNode) {
        requestAnimationFrame(renderLoop);
      }
    }

    document.getElementById('playBtn').addEventListener('click', play);

    function updateLevelMeter(peak) {
      const bar = document.getElementById('levelMeterBar');
      const pct = Math.min(peak, 1) * 100;
      bar.style.width = pct + '%';
      if (peak > 0.9) {
        bar.style.backgroundColor = '#e05a4e';
      } else if (peak > 0.7) {
        bar.style.backgroundColor = '#e0b83e';
      } else {
        bar.style.backgroundColor = '#3ecf6e';
      }
    }

    function micLevelLoop() {
      if (state.voces[0]) {
        const { peak } = state.voces[0].getLevel();
        updateLevelMeter(peak);
      }
      if (state.voces.length > 0) {
        requestAnimationFrame(micLevelLoop);
      }
    }

    document.getElementById('micBtn').addEventListener('click', async () => {
      const micStatus = document.getElementById('micStatus');
      try {
        if (state.audioContext.state === 'suspended') {
          await state.audioContext.resume();
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const voz = createVoz(stream, state.audioContext);
        state.voces.push(voz);
        micStatus.textContent = 'Micrófono activado.';
        document.getElementById('micBtn').disabled = true;
        document.getElementById('micGain').disabled = false;
        requestAnimationFrame(micLevelLoop);
      } catch (err) {
        micStatus.textContent = `Error al activar el micrófono: ${err.message || 'permiso denegado'}`;
      }
    });

    document.getElementById('micGain').addEventListener('input', (e) => {
      if (state.voces[0]) {
        state.voces[0].setGain(parseFloat(e.target.value));
      }
    });
  </script>
</body>
</html>
