<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App voz — Piano roll de canto</title>
<style>
  body { background:#12141c; color:#e8ecf4; font-family: system-ui, sans-serif; margin:0; padding:24px; }
  .controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  #status { font-size:14px; opacity:0.8; margin-bottom:12px; line-height:1.6; }
  #pianoRoll { width:100%; max-width:900px; height:240px; background:#1a1d29; border-radius:8px; display:block; }
  button { background:#4a90d9; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .mic-controls { display:flex; align-items:center; gap:12px; margin: 16px 0; flex-wrap:wrap; }
  #levelMeterTrack { width:220px; height:16px; background:#1a1d29; border-radius:4px; overflow:hidden; }
  #levelMeterBar { height:100%; width:0%; background:#3ecf6e; transition: width 0.05s linear, background-color 0.1s linear; }
  input[type="range"] { width:160px; }
</style>
</head>
<body>
  <h1>App voz — Etapa 1</h1>
  <div class="controls">
    <label>MIDI: <input type="file" id="midiInput" accept=".mid,.midi"></label>
    <label>WAV: <input type="file" id="wavInput" accept=".wav"></label>
    <button id="playBtn">Reproducir</button>
    <label><input type="checkbox" id="muteWavCheckbox"> Silenciar pista</label>
    <label><input type="checkbox" id="metronomeCheckbox"> Metrónomo</label>
  </div>
  <div id="status">
    <div id="midiStatus">Sin MIDI cargado.</div>
    <div id="wavStatus">Sin WAV cargado.</div>
  </div>
  <div class="mic-controls">
    <button id="micBtn">Activar micrófono</button>
    <label>Ganancia: <input type="range" id="micGain" min="0" max="2" step="0.01" value="1" disabled></label>
    <div id="levelMeterTrack"><div id="levelMeterBar"></div></div>
  </div>
  <div id="micStatus">Micrófono no activado.</div>
  <div id="pitchDisplay">Nota detectada: —</div>
  <canvas id="pianoRoll" width="900" height="240"></canvas>

  <script src="./midi-parser.js"></script>
  <script src="./piano-roll-geometry.js"></script>
  <script src="./audio-level.js"></script>
  <script src="./pitch-detection.js"></script>
  <script src="./note-utils.js"></script>
  <script src="./note-tuning.js"></script>
  <script>
    const state = {
      audioContext: new (window.AudioContext || window.webkitAudioContext)(),
      audioBuffer: null,
      notes: [],
      durationSec: 0,
      sourceNode: null,
      playStartTime: 0,
      voces: [],
      noteProgress: [],
      lastFrameTime: null,
      activeNoteIndex: null,
      activeNoteColor: null,
      lastActiveNoteIndex: null,
      lastActiveNoteColor: null,
      frozenTime: null,
      beats: [],
      metronomeNodes: []
    };

    state.wavGainNode = state.audioContext.createGain();
    state.wavGainNode.connect(state.audioContext.destination);
    state.wavGainNode.gain.value = document.getElementById('muteWavCheckbox').checked ? 0 : 1;

    const PIXELS_PER_SECOND = 150;
    const PLAYHEAD_X = 120;
    const ROW_HEIGHT = 18;
    const COLOR_UPCOMING = '#4a90d9';
    const COLOR_IN_TUNE = '#3ecf6e';
    const COLOR_OUT_OF_TUNE = '#e05a4e';
    const COLOR_NO_SIGNAL = '#6b7280';

    function createVoz(stream, audioContext) {
      const source = audioContext.createMediaStreamSource(stream);
      const gainNode = audioContext.createGain();
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(gainNode);
      gainNode.connect(analyser);
      const byteBuffer = new Uint8Array(analyser.fftSize);
      const floatBuffer = new Float32Array(analyser.fftSize);
      return {
        stream,
        source,
        gainNode,
        analyser,
        setGain(value) {
          gainNode.gain.value = value;
        },
        getLevel() {
          analyser.getByteTimeDomainData(byteBuffer);
          return computeLevel(byteBuffer);
        },
        getPitch() {
          analyser.getFloatTimeDomainData(floatBuffer);
          return detectPitch(floatBuffer, audioContext.sampleRate);
        }
      };
    }

    function resetNoteProgress() {
      state.noteProgress = state.notes.map(() => ({ timeInTune: 0, timeTotal: 0 }));
      state.activeNoteIndex = null;
      state.activeNoteColor = null;
      state.lastActiveNoteIndex = null;
      state.lastActiveNoteColor = null;
      state.frozenTime = null;
    }

    function currentPlaybackTime() {
      if (state.sourceNode) {
        return state.audioContext.currentTime - state.playStartTime;
      }
      return state.frozenTime !== null ? state.frozenTime : 0;
    }

    function renderPianoRoll() {
      const canvas = document.getElementById('pianoRoll');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const { minPitch, maxPitch } = pitchRange(state.notes);
      const currentTime = currentPlaybackTime();
      const view = {
        currentTime,
        pixelsPerSecond: PIXELS_PER_SECOND,
        playheadX: PLAYHEAD_X,
        minPitch, maxPitch,
        canvasHeight: canvas.height,
        rowHeight: ROW_HEIGHT
      };

      const isLive = state.sourceNode !== null;

      state.notes.forEach((note, i) => {
        const rect = computeNoteRect(note, view);
        const status = noteStatus(note, currentTime);

        if (status === 'active' && isLive) {
          const color = i === state.activeNoteIndex ? state.activeNoteColor : 'no-signal';
          ctx.fillStyle =
            color === 'in-tune' ? COLOR_IN_TUNE :
            color === 'out-of-tune' ? COLOR_OUT_OF_TUNE :
            COLOR_NO_SIGNAL;
          ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
        } else if (status !== 'past') {
          ctx.fillStyle = COLOR_UPCOMING;
          ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
        } else {
          const ratio = tuningRatio(state.noteProgress[i]);
          const greenWidth = rect.width * ratio;
          ctx.fillStyle = COLOR_IN_TUNE;
          ctx.fillRect(rect.x, rect.y, greenWidth, rect.height);
          ctx.fillStyle = COLOR_OUT_OF_TUNE;
          ctx.fillRect(rect.x + greenWidth, rect.y, rect.width - greenWidth, rect.height);
        }
      });

      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(PLAYHEAD_X, 0);
      ctx.lineTo(PLAYHEAD_X, canvas.height);
      ctx.stroke();
    }

    function playSuccessBlip(audioContext) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.16);
    }

    function playMetronomeClick(audioContext, when) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'square';
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(0.15, when + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.03);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(when);
      osc.stop(when + 0.04);
      return osc;
    }

    renderPianoRoll();
    requestAnimationFrame(mainLoop);

    document.getElementById('midiInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        const { notes, durationSec, beats } = parseMidi(buffer);
        state.notes = notes;
        state.durationSec = durationSec;
        state.beats = beats;
        resetNoteProgress();
        document.getElementById('midiStatus').textContent =
          `MIDI cargado: ${notes.length} notas, duración ${durationSec.toFixed(2)}s`;
        renderPianoRoll();
      } catch (err) {
        state.notes = [];
        state.durationSec = 0;
        state.beats = [];
        resetNoteProgress();
        document.getElementById('midiStatus').textContent =
          `Error al cargar el MIDI: ${err.message || 'Archivo MIDI inválido'}`;
        renderPianoRoll();
      }
    });

    document.getElementById('wavInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const arrayBuffer = await file.arrayBuffer();
        state.audioBuffer = await state.audioContext.decodeAudioData(arrayBuffer);
        document.getElementById('wavStatus').textContent =
          `WAV cargado: ${state.audioBuffer.duration.toFixed(2)}s`;
      } catch (err) {
        state.audioBuffer = null;
        document.getElementById('wavStatus').textContent =
          `Error al cargar el WAV: ${err.message || 'Archivo WAV inválido'}`;
      }
    });

    async function play() {
      if (!state.audioBuffer) return;
      if (state.audioContext.state === 'suspended') {
        await state.audioContext.resume();
      }
      if (state.sourceNode) {
        state.sourceNode.onended = null;
        state.sourceNode.stop();
      }
      state.metronomeNodes.forEach((osc) => {
        try { osc.stop(); } catch (err) { /* already stopped, ignore */ }
      });
      state.metronomeNodes = [];
      state.frozenTime = null;
      resetNoteProgress();
      const node = state.audioContext.createBufferSource();
      node.buffer = state.audioBuffer;
      node.connect(state.wavGainNode);
      state.sourceNode = node;
      state.playStartTime = state.audioContext.currentTime;
      node.start();
      node.onended = () => {
        if (state.sourceNode === node) {
          state.frozenTime = state.audioContext.currentTime - state.playStartTime;
          state.sourceNode = null;
        }
      };
      if (document.getElementById('metronomeCheckbox').checked) {
        state.beats.forEach((beatTime) => {
          const osc = playMetronomeClick(state.audioContext, state.playStartTime + beatTime);
          state.metronomeNodes.push(osc);
        });
      }
    }

    document.getElementById('playBtn').addEventListener('click', play);

    document.getElementById('muteWavCheckbox').addEventListener('change', (e) => {
      state.wavGainNode.gain.value = e.target.checked ? 0 : 1;
    });

    function updateLevelMeter(peak) {
      const bar = document.getElementById('levelMeterBar');
      const pct = Math.min(peak, 1) * 100;
      bar.style.width = pct + '%';
      if (peak > 0.9) {
        bar.style.backgroundColor = '#e05a4e';
      } else if (peak > 0.7) {
        bar.style.backgroundColor = '#e0b83e';
      } else {
        bar.style.backgroundColor = '#3ecf6e';
      }
    }

    function updatePitchDisplay(frequency) {
      const el = document.getElementById('pitchDisplay');
      if (frequency === null) {
        el.textContent = 'Nota detectada: —';
        return;
      }
      const { noteName, cents } = describePitch(frequency);
      const sign = cents >= 0 ? '+' : '';
      el.textContent = `Nota detectada: ${noteName} (${frequency.toFixed(1)} Hz, ${sign}${cents.toFixed(0)} cents)`;
    }

    function updateNoteProgress(currentTime, detectedFrequency, deltaSeconds) {
      let activeIndex = null;
      let activeColor = null;

      if (state.sourceNode) {
        state.notes.forEach((note, i) => {
          if (noteStatus(note, currentTime) !== 'active') return;
          activeIndex = i;
          activeColor = liveNoteColor(detectedFrequency, note.pitch);
          if (deltaSeconds > 0) {
            const isInTuneNow = activeColor === 'in-tune';
            state.noteProgress[i] = accumulateTuning(state.noteProgress[i], isInTuneNow, deltaSeconds);
          }
        });
      }

      state.lastActiveNoteIndex = state.activeNoteIndex;
      state.lastActiveNoteColor = state.activeNoteColor;
      state.activeNoteIndex = activeIndex;
      state.activeNoteColor = activeColor;

      if (
        activeIndex !== null &&
        activeIndex === state.lastActiveNoteIndex &&
        state.lastActiveNoteColor !== 'in-tune' &&
        activeColor === 'in-tune'
      ) {
        playSuccessBlip(state.audioContext);
      }
    }

    function mainLoop() {
      const now = state.audioContext.currentTime;
      const deltaSeconds = state.lastFrameTime === null ? 0 : now - state.lastFrameTime;
      state.lastFrameTime = now;

      const currentTime = currentPlaybackTime();
      let detectedFrequency = null;
      if (state.voces[0]) {
        const { peak } = state.voces[0].getLevel();
        updateLevelMeter(peak);
        detectedFrequency = peak > 0.02 ? state.voces[0].getPitch() : null;
        updatePitchDisplay(detectedFrequency);
      }

      updateNoteProgress(currentTime, detectedFrequency, deltaSeconds);
      renderPianoRoll();

      requestAnimationFrame(mainLoop);
    }

    document.getElementById('micBtn').addEventListener('click', async () => {
      const micBtn = document.getElementById('micBtn');
      const micStatus = document.getElementById('micStatus');
      micBtn.disabled = true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micStatus.textContent = 'Error al activar el micrófono: este navegador no permite acceso al micrófono desde este origen (probá abriendo la app con http://localhost o https://).';
        micBtn.disabled = false;
        return;
      }
      try {
        if (state.audioContext.state === 'suspended') {
          await state.audioContext.resume();
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const voz = createVoz(stream, state.audioContext);
        state.voces.push(voz);
        micStatus.textContent = 'Micrófono activado.';
        document.getElementById('micGain').disabled = false;
      } catch (err) {
        micBtn.disabled = false;
        let msg = 'No se pudo activar el micrófono.';
        if (err.name === 'NotAllowedError') {
          msg = 'Permiso de micrófono denegado. Revisá los permisos del sitio en el navegador.';
        } else if (err.name === 'NotFoundError') {
          msg = 'No se encontró ningún micrófono conectado.';
        } else if (err.message) {
          msg = `Error al activar el micrófono: ${err.message}`;
        }
        micStatus.textContent = msg;
      }
    });

    document.getElementById('micGain').addEventListener('input', (e) => {
      if (state.voces[0]) {
        state.voces[0].setGain(parseFloat(e.target.value));
      }
    });
  </script>
</body>
</html>
